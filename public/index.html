<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif'] },
          colors: {
            primary:  { DEFAULT:'#2563EB', light:'#EFF6FF', muted:'#DBEAFE', dark:'#1D4ED8' },

            danger:   { DEFAULT:'#DC2626', light:'#FEF2F2' },
            warning:  { DEFAULT:'#D97706', light:'#FFFBEB' },
            surface:  { DEFAULT:'#FFFFFF', 2:'#F8FAFC' },

            ink:      { 1:'#0F172A', 2:'#334155', 3:'#64748B', 4:'#94A3B8' },
          },
          fontSize: {
            '2xs':['10px','14px'], xs:['11px','15px'], sm:['12px','16px'],
            base:['13px','18px'], md:['14px','20px'], lg:['15px','22px'],
            xl:['17px','24px'], '2xl':['20px','28px'], '3xl':['24px','32px'],

        }
      }
    }
